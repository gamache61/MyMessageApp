        body {
            margin: 0;
            background-color: #000000;
            color: white;
            font-family: system-ui, -apple-system, sans-serif;

<body>

    <div style="text-align: center; padding-top: 50px;">
        <h1>My Custom App</h1>
        <p></p><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Message</title>
    <style>
        body {
            height: 100dvh; 
            -webkit-text-size-adjust: 100%;
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
            display: flex;
            align-items: center; 
            justify-content: center; /* Center text when typing */
        }

        /* --- 1. REVEAL CURTAIN --- */
        #reveal-curtain {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 2000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; transition: opacity 0.8s ease;
        }
        .envelope { font-size: 80px; animation: bounce 2s infinite; cursor: pointer; }
        .tap-text { margin-top: 20px; font-size: 18px; color: #888; animation: pulse 1.5s infinite; }

        @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-20px);} 60% {transform: translateY(-10px);} }
        @keyframes pulse { 0% {opacity: 0.5;} 50% {opacity: 1;} 100% {opacity: 0.5;} }

        /* --- 2. TEXT DISPLAY --- */
        #marquee-container {
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            position: absolute;
            display: flex;             /* Helps center text during typewriter phase */
            align-items: center;
        }

        #scrolling-text {
            display: inline-block;
            font-size: 20vw; 
            font-weight: bold;
            color: #00ff00; 
            /* Start centered for typing, move to right for scrolling later */
            width: 100%;
            text-align: center;
        }

        /* Animation Classes */
        .scrolling {
            padding-left: 100%;
            width: auto !important; /* Allow it to stretch for scrolling */
            text-align: left !important;
            animation: scroll-left var(--speed, 10s) linear infinite;
        }

        .blinking {
            animation: scroll-left var(--speed, 10s) linear infinite, blink-anim 0.4s steps(2, start) infinite !important;
        }
        
        /* Only blink, no scroll (for when stationary) */
        .blink-static {
            animation: blink-anim 0.4s steps(2, start) infinite;
        }

        @keyframes scroll-left { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
        @keyframes blink-anim { to { visibility: hidden; } }

        /* LED Mode */
        .led-mode {
            background-image: radial-gradient(#111 20%, transparent 20%), radial-gradient(#111 20%, transparent 20%);
            background-color: #000; background-position: 0 0, 4px 4px; background-size: 8px 8px;
            text-shadow: 0 0 10px currentColor; 
        }

        /* --- 3. CONTROLS --- */
        #controls {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(20, 20, 20, 0.95); padding: 20px; border-radius: 12px;
            display: flex; flex-direction: column; gap: 12px; z-index: 1000;
            width: 90%; max-width: 400px; border: 1px solid #444; transition: opacity 0.3s ease;
        }
        #controls.hidden { opacity: 0; pointer-events: none; }

        input, button { padding: 10px; font-size: 16px; border-radius: 6px; border: none; }
        .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
        .toggle-btn { background: #333; color: #fff; flex: 1; font-size: 12px; transition: 0.2s; }
        .toggle-btn.active { background: #00ff00; color: #000; font-weight: bold; }
        #copyLinkBtn { background: #0084ff; color: white; font-weight: bold; font-size: 18px; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="reveal-curtain" style="display: none;">
        <div class="envelope">📩</div>
        <div class="tap-text">TAP TO OPEN</div>
    </div>

    <div id="marquee-container">
        <div id="scrolling-text">TYPE MESSAGE</div>
    </div>

    <div id="controls">
        <input type="text" id="messageInput" placeholder="Type message..." value="HELLO">
        <div class="row">
            <input type="color" id="colorPicker" value="#00ff00" style="height:40px; width:50px;">
            <button id="ledToggle" class="toggle-btn">LED: OFF</button>
            <button id="blinkToggle" class="toggle-btn">BLINK: OFF</button>
            <button id="typeToggle" class="toggle-btn">TYPE: OFF</button>
        </div>
        <div class="row"><label style="color:white">Speed</label><input type="range" id="speedSlider" min="1" max="50" value="10" style="flex:1;"></div>
        <div class="row"><label style="color:white">Size</label><input type="range" id="sizeSlider" min="5" max="50" value="20" style="flex:1;"></div>
        <button id="copyLinkBtn">Copy Link to Send</button>
        <div style="text-align:center; color:#666; font-size:12px;">(Tap screen to hide controls)</div>
    </div>

    <script>
        const textElement = document.getElementById('scrolling-text');
        const input = document.getElementById('messageInput');
        const controls = document.getElementById('controls');
        const curtain = document.getElementById('reveal-curtain');
        
        // Toggles
        const btns = { led: document.getElementById('ledToggle'), blink: document.getElementById('blinkToggle'), type: document.getElementById('typeToggle') };
        const sliders = { speed: document.getElementById('speedSlider'), size: document.getElementById('sizeSlider') };
        const colorPicker = document.getElementById('colorPicker');

        let state = { led: false, blink: false, type: false };

        // --- 1. INITIALIZE ---
        const params = new URLSearchParams(window.location.search);

        // helper to set CSS var for speed
        function setSpeed() {
            const val = parseInt(sliders.speed.value);
            const duration = 21 - (val * 0.4);
            textElement.style.setProperty('--speed', duration + 's');
        }

        // helper to set size
        function setSize() { textElement.style.fontSize = sliders.size.value + "vw"; }

        // toggle button logic
        function toggle(key, forceVal = null) {
            state[key] = (forceVal !== null) ? forceVal : !state[key];
            const btn = btns[key];
            
            if (state[key]) {
                btn.classList.add('active');
                btn.innerText = key.toUpperCase() + ": ON";
            } else {
                btn.classList.remove('active');
                btn.innerText = key.toUpperCase() + ": OFF";
            }

            // Live updates for Creator Mode
            if (key === 'led') {
                document.body.className = state.led ? 'led-mode' : '';
                textElement.style.fontFamily = state.led ? "'Courier New', monospace" : "sans-serif";
            }
            if (key === 'blink' && !state.type) {
                // Only toggle blink live if we aren't waiting for typewriter
                if(state.blink) textElement.classList.add('blink-static');
                else textElement.classList.remove('blink-static');
            }
        }

        // Listeners
        Object.keys(btns).forEach(key => btns[key].addEventListener('click', () => toggle(key)));
        sliders.speed.addEventListener('input', setSpeed);
        sliders.size.addEventListener('input', setSize);
        colorPicker.addEventListener('input', () => textElement.style.color = colorPicker.value);
        input.addEventListener('input', () => { if(!state.type) textElement.innerText = input.value; });

        // --- 2. SEQUENCE LOGIC (The Core Fix) ---
        function startSequence(msg) {
            // 1. Setup Curtain
            curtain.style.display = 'flex';
            controls.className = 'hidden';
            textElement.innerText = ""; // Clear text initially
            
            // 2. Wait for Click
            curtain.addEventListener('click', () => {
                curtain.style.opacity = '0';
                setTimeout(() => { curtain.style.display = 'none'; }, 800);
                
                // 3. Check for Typewriter vs Instant
                if (state.type) {
                    runTypewriter(msg);
                } else {
                    startScrolling(msg);
                }
            }, { once: true });
        }

        function runTypewriter(msg) {
            let i = 0;
            textElement.innerText = "";
            textElement.classList.remove('scrolling', 'blinking', 'blink-static');
            
            const timer = setInterval(() => {
                textElement.innerText += msg.charAt(i);
                i++;
                if (i >= msg.length) {
                    clearInterval(timer);
                    setTimeout(() => startScrolling(msg), 1000); // Wait 1s then scroll
                }
            }, 200); // Typing speed
        }

        function startScrolling(msg) {
            textElement.innerText = msg;
            // Apply Scroll Class
            if (state.blink) {
                textElement.className = 'blinking'; // Combines scroll + blink
            } else {
                textElement.className = 'scrolling';
            }
        }

        // --- 3. CHECK URL ON LOAD ---
        if (params.has('msg')) {
            // RECEIVER MODE
            const msg = decodeURIComponent(params.get('msg'));
            input.value = msg;
            
            // Load Settings
            if (params.has('color')) textElement.style.color = '#' + params.get('color');
            if (params.has('speed')) sliders.speed.value = params.get('speed');
            if (params.has('size')) sliders.size.value = params.get('size');
            
            setSpeed();
            setSize();

            // Load Toggles (Visual only, logic handled in sequence)
            toggle('led', params.get('led') === 'true');
            toggle('blink', params.get('blink') === 'true');
            toggle('type', params.get('type') === 'true');

            // Start the Show
            startSequence(msg);

        } else {
            // CREATOR MODE
            setSpeed();
            setSize();
            textElement.innerText = input.value;
            textElement.className = 'scrolling'; // Default to scrolling in creator mode
        }

        // --- 4. COPY LINK ---
        document.getElementById('copyLinkBtn').addEventListener('click', () => {
            const baseUrl = window.location.href.split('?')[0];
            const msg = encodeURIComponent(input.value);
            const col = colorPicker.value.replace('#', '');
            const url = `${baseUrl}?msg=${msg}&color=${col}&speed=${sliders.speed.value}&size=${sliders.size.value}&led=${state.led}&blink=${state.blink}&type=${state.type}`;
            
            navigator.clipboard.writeText(url).then(() => alert("Link Copied! Send it to your friend."));
        });

        // Hide/Show controls
        document.body.addEventListener('click', (e) => {
            if (controls.contains(e.target) || curtain.contains(e.target)) return;
            controls.classList.toggle('hidden');
        });

    </script>
</body>
</html>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js');
            });
        }
    </script>
</body>
</html>
