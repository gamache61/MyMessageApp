    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My App</title>
    
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">

    <style>
        /* This makes the app dark and prevents bouncing on mobile */
        body {
            margin: 0;
            background-color: #000000;
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden; /* Stops scrolling if you don't need it */
        }
    </style>

<body>

    <div style="text-align: center; padding-top: 50px;">
        <h1>My Custom App</h1>
        <p></p><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Message</title>
    <style>
        body {
            height: 100dvh; 
            -webkit-text-size-adjust: 100%;
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
            display: flex;
            align-items: center; 
        }

        /* --- MARQUEE CONTAINER --- */
        #marquee-container {
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            position: absolute;
        }

        /* --- THE TEXT --- */
        #scrolling-text {
            display: inline-block;
            font-size: 20vw; 
            font-weight: bold;
            color: #00ff00; 
            padding-left: 100%; 
            /* We handle animation via JS class now to allow Typewriter effect */
        }

        /* SCROLLING ANIMATION */
        .animate-scroll {
            animation-name: scroll-left;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        /* BLINKING ANIMATION (Stronger Flash) */
        .blinking {
            animation-name: scroll-left, blink-anim !important;
            animation-timing-function: linear, step-end !important;
            animation-iteration-count: infinite, infinite !important;
            animation-direction: normal, alternate !important;
            animation-duration: var(--scroll-duration), 0.5s !important;
        }

        @keyframes scroll-left {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        @keyframes blink-anim {
            0% { visibility: visible; }
            50% { visibility: hidden; }
            100% { visibility: visible; }
        }

        /* LED MODE */
        .led-mode {
            background-image: radial-gradient(#000 20%, transparent 20%), radial-gradient(#000 20%, transparent 20%);
            background-color: #222;
            background-position: 0 0, 4px 4px;
            background-size: 8px 8px;
            text-shadow: 0 0 10px currentColor; 
        }

        /* CONTROLS */
        #controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 30, 30, 0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 1000;
            width: 90%;
            max-width: 400px;
            border: 1px solid #444;
            transition: opacity 0.3s ease;
        }

        #controls.hidden { opacity: 0; pointer-events: none; }

        /* INPUTS */
        input, select, button {
            padding: 10px; font-size: 16px; border-radius: 8px; border: none;
        }
        input[type="text"] { background: #eee; font-weight: bold; color: #333; }
        label { color: #ccc; font-size: 14px; }
        
        .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
        
        /* BUTTON STYLES */
        .toggle-btn { background: #444; color: white; flex-grow: 1; font-size: 13px; transition: 0.2s; }
        .toggle-btn.active { background: #00ff00; color: black; font-weight: bold; }
        
        #copyLinkBtn { background: #0084ff; color: white; font-weight: bold; font-size: 18px; margin-top: 5px; }

    </style>
</head>
<body>

    <div id="marquee-container">
        <div id="scrolling-text" class="animate-scroll"></div>
    </div>

    <div id="controls">
        <input type="text" id="messageInput" placeholder="Type message..." value="HELLO">
        
        <div class="row">
            <input type="color" id="colorPicker" value="#00ff00" style="height: 40px; width: 50px;">
            <button id="ledToggle" class="toggle-btn">LED: OFF</button>
            <button id="blinkToggle" class="toggle-btn">BLINK: OFF</button>
            <button id="typeToggle" class="toggle-btn">TYPE: OFF</button>
        </div>

        <div class="row">
            <label>Speed</label>
            <input type="range" id="speedSlider" min="1" max="50" value="10" style="flex-grow:1;">
        </div>

        <div class="row">
            <label>Size</label>
            <input type="range" id="sizeSlider" min="5" max="50" value="20" style="flex-grow:1;">
        </div>

        <button id="copyLinkBtn">Copy Link to Send</button>
        <div style="text-align: center; color: #666; font-size: 12px;">(Tap screen to hide controls)</div>
    </div>

    <script>
        const textElement = document.getElementById('scrolling-text');
        const input = document.getElementById('messageInput');
        const colorPicker = document.getElementById('colorPicker');
        const speedSlider = document.getElementById('speedSlider');
        const sizeSlider = document.getElementById('sizeSlider');
        const controls = document.getElementById('controls');
        
        // Buttons
        const btnLed = document.getElementById('ledToggle');
        const btnBlink = document.getElementById('blinkToggle');
        const btnType = document.getElementById('typeToggle');

        // State
        let state = {
            led: false,
            blink: false,
            typewriter: false
        };

        // --- 1. INITIAL SETUP ---
        const params = new URLSearchParams(window.location.search);
        
        // Function to run Typewriter Effect
        function runTypewriter(text) {
            // Stop scrolling temporarily
            textElement.classList.remove('animate-scroll');
            textElement.classList.remove('blinking');
            textElement.style.paddingLeft = "0"; // Center it roughly for typing
            textElement.style.textAlign = "center";
            textElement.style.width = "100%";
            textElement.innerText = ""; // Clear text
            
            let i = 0;
            const typingSpeed = 200; // ms per letter

            const timer = setInterval(() => {
                textElement.innerText += text.charAt(i);
                i++;
                if (i >= text.length) {
                    clearInterval(timer);
                    // Finished typing. Wait 1 second, then start scrolling
                    setTimeout(() => {
                        textElement.style.paddingLeft = "100%";
                        textElement.style.textAlign = "";
                        textElement.style.width = "";
                        textElement.classList.add('animate-scroll');
                        if(state.blink) textElement.classList.add('blinking');
                        updateSpeed(); // Re-apply speed variable
                    }, 1000);
                }
            }, typingSpeed);
        }

        // --- 2. LOAD FROM LINK ---
        if (params.has('msg')) {
            // RECEIVER MODE
            controls.className = 'hidden'; // Hide buttons
            
            const msg = decodeURIComponent(params.get('msg'));
            input.value = msg;

            // Load Settings
            if (params.has('color')) textElement.style.color = '#' + params.get('color');
            if (params.has('speed')) speedSlider.value = params.get('speed');
            if (params.has('size')) sizeSlider.value = params.get('size');

            // Set Toggles
            if (params.get('led') === 'true') toggleBtn(btnLed, 'led', true);
            if (params.get('blink') === 'true') toggleBtn(btnBlink, 'blink', true);
            if (params.get('type') === 'true') {
                toggleBtn(btnType, 'typewriter', true);
                runTypewriter(msg); // RUN THE EFFECT
            } else {
                textElement.innerText = msg;
            }

        } else {
            // CREATOR MODE
            textElement.innerText = input.value;
        }

        // --- 3. CORE UPDATES ---
        input.addEventListener('input', () => { 
            if(!state.typewriter) textElement.innerText = input.value || " "; 
        });
        colorPicker.addEventListener('input', () => { textElement.style.color = colorPicker.value; });
        
        function updateSpeed() {
            const speedVal = parseInt(speedSlider.value);
            const duration = 21 - (speedVal * 0.4); 
            // We set a CSS variable so the blinking animation can see it too
            textElement.style.setProperty('--scroll-duration', duration + 's');
            textElement.style.animationDuration = duration + 's';
        }
        speedSlider.addEventListener('input', updateSpeed);
        updateSpeed(); // Init

        function updateSize() {
            textElement.style.fontSize = sizeSlider.value + "vw";
        }
        sizeSlider.addEventListener('input', updateSize);
        updateSize(); // Init

        // --- 4. TOGGLE SYSTEM ---
        function toggleBtn(btn, stateKey, forceState = null) {
            // Flip state or force it
            state[stateKey] = (forceState !== null) ? forceState : !state[stateKey];
            const isOn = state[stateKey];

            // Visual update
            if (isOn) {
                btn.classList.add('active');
                btn.innerText = btn.innerText.split(':')[0] + ": ON";
            } else {
                btn.classList.remove('active');
                btn.innerText = btn.innerText.split(':')[0] + ": OFF";
            }

            // Logic update
            if (stateKey === 'led') {
                document.body.className = isOn ? 'led-mode' : '';
                textElement.style.fontFamily = isOn ? "'Courier New', monospace" : "sans-serif";
            }
            if (stateKey === 'blink') {
                if (isOn) textElement.classList.add('blinking');
                else textElement.classList.remove('blinking');
            }
            // Typewriter logic happens only on load usually, or we can trigger it:
            if (stateKey === 'typewriter' && isOn && forceState === null) {
                runTypewriter(input.value);
            }
        }

        btnLed.addEventListener('click', () => toggleBtn(btnLed, 'led'));
        btnBlink.addEventListener('click', () => toggleBtn(btnBlink, 'blink'));
        btnType.addEventListener('click', () => toggleBtn(btnType, 'typewriter'));


        // --- 5. COPY LINK ---
        document.getElementById('copyLinkBtn').addEventListener('click', () => {
            const baseUrl = window.location.href.split('?')[0];
            const msg = encodeURIComponent(input.value);
            const col = colorPicker.value.replace('#', '');
            
            const fullLink = `${baseUrl}?msg=${msg}&color=${col}&speed=${speedSlider.value}&size=${sizeSlider.value}&led=${state.led}&blink=${state.blink}&type=${state.typewriter}`;
            
            navigator.clipboard.writeText(fullLink).then(() => {
                alert("Link Copied! Settings saved.");
            });
        });

        // --- 6. HIDE/SHOW CONTROLS ---
        document.body.addEventListener('click', (e) => {
            if (controls.contains(e.target)) return;
            controls.classList.toggle('hidden');
        });
    </script>
</body>
</html>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js');
            });
        }
    </script>
</body>
</html>
