<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Secret Message</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.svg">

    <style>
        body {
            background-color: #111827; /* Dark Background */
            color: #f3f4f6;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* --- THE MESSAGE WORDS --- */
        #message-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px; /* Bigger gap */
            margin: 50px 0;
            width: 100%;
        }

        .word {
            /* 100% BIGGER FONTS AND BOXES */
            font-size: 4rem; /* Huge text */
            font-weight: 900;
            background-color: #e5e7eb; /* The "Redacted" Block color */
            color: #e5e7eb; /* Hide text by making it same color as block */
            padding: 15px 30px; /* Bigger padding */
            border-radius: 8px;
            user-select: none;
            cursor: pointer;
            transition: all 0.3s ease;
            line-height: 1;
        }

        /* REVEALED STATE */
        .word.revealed {
            background-color: transparent;
            color: #22c55e; /* Bright Green */
            text-shadow: 0 0 15px #22c55e; /* Glowing effect */
        }

        /* BLINK ANIMATION */
        .blinking {
            animation: blinker 0.5s linear infinite;
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }

        /* --- INPUT STYLING --- */
        input {
            background: #1f2937;
            border: 2px solid #374151;
            padding: 20px; /* Bigger padding */
            font-size: 2rem; /* Bigger text */
            color: white;
            border-radius: 10px;
            width: 80%;
            max-width: 800px;
            text-align: center;
            outline: none;
        }
        
        input:focus {
            border-color: #22c55e;
        }

        /* --- BUTTON STYLING --- */
        button {
            padding: 20px 40px; /* Massive buttons */
            font-size: 1.5rem; /* Bigger text */
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: transform 0.1s;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }
        button:active { transform: scale(0.96); }

    </style>
</head>
<body>

    <div id="setup-area" class="flex flex-col items-center w-full mb-10">
        <label for="input-msg" class="text-2xl text-gray-400 font-bold mb-4 tracking-widest uppercase">
            Enter Your Text Here:
        </label>
        
        <input type="text" id="input-msg" value="HELLO WORLD">
        
        <button onclick="setMessage()" class="bg-gray-700 text-white mt-6 hover:bg-gray-600 w-1/2">
            LOAD MESSAGE
        </button>
    </div>

    <div id="message-container">
        </div>

    <div class="flex flex-wrap justify-center gap-6 mt-10 w-full">
        <button onclick="toggleBlink()" id="btn-blink" class="bg-red-600 text-white hover:bg-red-500 border-b-4 border-red-800">
            BLINK
        </button>

        <button onclick="toggleReveal()" id="btn-reveal" class="bg-blue-600 text-white hover:bg-blue-500 border-b-4 border-blue-800">
            REVEAL
        </button>
    </div>

    <script>
        // --- LOGIC ---
        let isRevealed = false;
        let isBlinking = false;

        function setMessage() {
            const input = document.getElementById('input-msg').value.toUpperCase();
            const container = document.getElementById('message-container');
            
            // Clear old message
            container.innerHTML = '';
            
            // Reset states
            isRevealed = false;
            isBlinking = false;
            updateButtons(); // Reset button text

            // Create large blocks for each word
            const words = input.split(' ');
            words.forEach(wordText => {
                if(wordText.trim() === "") return; // Skip empty spaces
                const span = document.createElement('span');
                span.innerText = wordText;
                span.className = 'word'; // Default is hidden (block style)
                
                // Allow clicking individual words to reveal them
                span.onclick = function() {
                    this.classList.toggle('revealed');
                }
                
                container.appendChild(span);
            });
        }

        function toggleReveal() {
            const words = document.querySelectorAll('.word');
            isRevealed = !isRevealed;
            
            words.forEach(w => {
                if(isRevealed) {
                    w.classList.add('revealed');
                } else {
                    w.classList.remove('revealed');
                }
            });
            updateButtons();
        }

        function toggleBlink() {
            const container = document.getElementById('message-container');
            isBlinking = !isBlinking;
            
            if(isBlinking) {
                container.classList.add('blinking');
            } else {
                container.classList.remove('blinking');
            }
            updateButtons();
        }

        function updateButtons() {
            const revBtn = document.getElementById('btn-reveal');
            const blkBtn = document.getElementById('btn-blink');

            // Update text based on state
            revBtn.innerText = isRevealed ? "HIDE TEXT" : "REVEAL";
            blkBtn.innerText = isBlinking ? "STOP BLINK" : "BLINK";
            
            // Visual feedback on buttons
            if(isRevealed) {
                revBtn.classList.remove('bg-blue-600', 'border-blue-800');
                revBtn.classList.add('bg-gray-600', 'border-gray-800');
            } else {
                revBtn.classList.add('bg-blue-600', 'border-blue-800');
                revBtn.classList.remove('bg-gray-600', 'border-gray-800');
            }
        }

        // Initialize on load
        setMessage();

        // --- CONNECT THE BRAIN (Service Worker) ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>

</body>
</html>
