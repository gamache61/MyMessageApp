<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My App</title>
    
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">

    <style>
        /* This makes the app dark and prevents bouncing on mobile */
        body {
            margin: 0;
            background-color: #000000;
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden; /* Stops scrolling if you don't need it */
        }

<body>

    <div style="text-align: center; padding-top: 50px;">
        <h1>My Custom App</h1>
        <p></p><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Message</title>
    <style>
        body {
            height: 100dvh; 
            -webkit-text-size-adjust: 100%;
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
            display: flex;
            align-items: center; 
        }

        #marquee-container {
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            position: absolute;
        }

        #scrolling-text {
            display: inline-block;
            font-size: 20vw; 
            font-weight: bold;
            color: #00ff00; 
            padding-left: 100%; 
            animation: scroll-left 10s linear infinite;
        }

        @keyframes scroll-left {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        .led-mode {
            background-image: radial-gradient(#000 20%, transparent 20%), radial-gradient(#000 20%, transparent 20%);
            background-color: #222;
            background-position: 0 0, 4px 4px;
            background-size: 8px 8px;
            text-shadow: 0 0 10px currentColor; 
        }

        /* CONTROL PANEL */
        #controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(40, 40, 40, 0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 1000;
            width: 85%;
            max-width: 400px;
            border: 1px solid #555;
            transition: opacity 0.3s ease, transform 0.3s ease;
            
            /* DEFAULT VISIBILITY IS ON */
            opacity: 1;
        }

        /* HIDDEN STATE - Applied by JS immediately if message found */
        #controls.hidden {
            opacity: 0;
            pointer-events: none; 
            transform: translateX(-50%) translateY(20px); 
        }

        input, select, button {
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
        }

        input[type="text"] {
            background: #eee;
            font-weight: bold;
        }

        button {
            background: #0084ff;
            color: white;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
        }
        
        button:active { transform: scale(0.98); }
        label { color: white; font-size: 14px; }
        .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
    </style>
</head>
<body>

    <div id="marquee-container">
        <div id="scrolling-text">TYPE MESSAGE</div>
    </div>

    <div id="controls">
        <input type="text" id="messageInput" placeholder="Type message..." value="HELLO">
        
        <div class="row">
            <input type="color" id="colorPicker" value="#00ff00" style="height: 40px; width: 60px;">
            <button id="ledToggle" style="flex-grow:1; font-size:14px;">LED FX: OFF</button>
        </div>

        <div class="row">
            <label>Speed:</label>
            <input type="range" id="speedSlider" min="1" max="50" value="10" style="flex-grow:1;">
        </div>

        <div class="row">
            <label>Size:</label>
            <input type="range" id="sizeSlider" min="5" max="50" value="20" style="flex-grow:1;">
        </div>

        <button id="copyLinkBtn">Copy Link to Send</button>
        <div style="text-align: center; color: #888; font-size: 12px; margin-top: -5px;">(Tap screen to hide/show)</div>
    </div>

    <script>
        const textElement = document.getElementById('scrolling-text');
        const input = document.getElementById('messageInput');
        const colorPicker = document.getElementById('colorPicker');
        const speedSlider = document.getElementById('speedSlider');
        const sizeSlider = document.getElementById('sizeSlider');
        const ledBtn = document.getElementById('ledToggle');
        const controls = document.getElementById('controls');
        
        let isLedMode = false;

        // --- 1. IMMEDIATE CHECK (The Fix) ---
        // We run this BEFORE anything else to hide controls instantly
        const params = new URLSearchParams(window.location.search);
        
        if (params.has('msg')) {
            // Apply text immediately
            input.value = decodeURIComponent(params.get('msg'));
            textElement.innerText = input.value;
            
            // Force controls to hide immediately
            controls.className = 'hidden'; 
            
            if (params.has('color')) textElement.style.color = '#' + params.get('color');
        }

        // --- 2. STANDARD FUNCTIONS ---
        input.addEventListener('input', () => { textElement.innerText = input.value || " "; });
        colorPicker.addEventListener('input', () => { textElement.style.color = colorPicker.value; });
        sizeSlider.addEventListener('input', () => { textElement.style.fontSize = sizeSlider.value + "vw"; });

        function updateSpeed() {
            const speedVal = parseInt(speedSlider.value);
            const duration = 21 - (speedVal * 0.4); 
            textElement.style.animationDuration = duration + 's';
        }
        speedSlider.addEventListener('input', updateSpeed);
        updateSpeed(); // Init

        ledBtn.addEventListener('click', () => {
            isLedMode = !isLedMode;
            if (isLedMode) {
                document.body.classList.add('led-mode');
                textElement.style.fontFamily = "'Courier New', monospace"; 
                ledBtn.innerText = "LED FX: ON";
                ledBtn.style.background = "#00ff00";
                ledBtn.style.color = "black";
            } else {
                document.body.classList.remove('led-mode');
                textElement.style.fontFamily = "sans-serif";
                ledBtn.innerText = "LED FX: OFF";
                ledBtn.style.background = "#0084ff";
                ledBtn.style.color = "white";
            }
        });

        // --- 3. COPY LINK ---
        document.getElementById('copyLinkBtn').addEventListener('click', () => {
            const baseUrl = window.location.href.split('?')[0];
            const msg = encodeURIComponent(input.value);
            const col = colorPicker.value.replace('#', '');
            
            const fullLink = `${baseUrl}?msg=${msg}&color=${col}`;
            
            navigator.clipboard.writeText(fullLink).then(() => {
                alert("Link Copied!");
            });
        });

        // --- 4. TOGGLE CONTROLS ---
        document.body.addEventListener('click', (e) => {
            // If they click INSIDE the box, do nothing
            if (controls.contains(e.target)) return;
            
            // If controls are hidden, show them. If showing, hide them.
            if (controls.classList.contains('hidden')) {
                controls.classList.remove('hidden');
            } else {
                controls.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js');
            });
        }
    </script>
</body>
</html>
