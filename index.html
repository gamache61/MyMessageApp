<body>

    <div style="text-align: center; padding-top: 50px;">
        <h1>My Custom App</h1>
        <p></p><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScrollShout - LED Banner</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            display: flex;
            align-items: center; 
        }

        /* --- NEW: FIXED APP TITLE --- */
        #app-title {
            position: fixed;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.5); /* Semi-transparent */
            font-family: sans-serif;
            font-size: 24px;
            font-weight: bold;
            z-index: 500; /* Behind controls, but above text if needed */
            pointer-events: none; /* Let clicks pass through it */
        }

        #marquee-container {
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            position: absolute;
        }

        #scrolling-text {
            display: inline-block;
            /* Default size, we will change this with JS now */
            font-size: 20vw; 
            font-weight: bold;
            color: #00ff00; 
            padding-left: 100%; 
            animation: scroll-left 10s linear infinite;
        }

        @keyframes scroll-left {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        .led-mode {
            background-image: radial-gradient(#000 20%, transparent 20%), radial-gradient(#000 20%, transparent 20%);
            background-color: #222;
            background-position: 0 0, 4px 4px;
            background-size: 8px 8px;
            text-shadow: 0 0 10px currentColor; 
        }

        #controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(40, 40, 40, 0.9);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
            width: 90%;
            max-width: 400px;
            border: 1px solid #444;
            opacity: 1;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        #controls.hidden {
            opacity: 0;
            pointer-events: none; 
            transform: translateX(-50%) translateY(20px); 
        }

        input, select, button {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
        }

        input[type="text"] {
            background: #eee;
        }

        button {
            background: #0084ff;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        label {
            color: white;
            font-size: 14px;
        }
        
        .row {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <div id="app-title">ScrollShout</div>

    <div id="marquee-container">
        <div id="scrolling-text">TYPE MESSAGE</div>
    </div>

    <div id="controls">
        <input type="text" id="messageInput" placeholder="Type message..." value="HELLO WORLD">
        
        <div class="row">
            <input type="color" id="colorPicker" value="#00ff00">
            <button id="ledToggle">LED FX: OFF</button>
        </div>

        <div class="row">
            <label>Speed:</label>
            <input type="range" id="speedSlider" min="1" max="50" value="10">
        </div>

        <div class="row">
            <label>Size:</label>
            <input type="range" id="sizeSlider" min="5" max="50" value="20">
        </div>

        <button id="copyLinkBtn">Copy Link to Send</button>
        <div style="text-align: center; color: #888; font-size: 12px;">(Tap background to hide controls)</div>
    </div>

    <script>
        const textElement = document.getElementById('scrolling-text');
        const input = document.getElementById('messageInput');
        const colorPicker = document.getElementById('colorPicker');
        const speedSlider = document.getElementById('speedSlider');
        const sizeSlider = document.getElementById('sizeSlider'); // New Variable
        const ledBtn = document.getElementById('ledToggle');
        const controls = document.getElementById('controls');
        
        let isLedMode = false;

        // --- LOAD FROM URL ---
        const params = new URLSearchParams(window.location.search);
        if (params.has('msg')) {
            input.value = decodeURIComponent(params.get('msg'));
            textElement.innerText = input.value;
        }
        if (params.has('color')) textElement.style.color = '#' + params.get('color');
        
        // --- TEXT UPDATE ---
        input.addEventListener('input', () => {
            textElement.innerText = input.value || " ";
        });

        // --- COLOR UPDATE ---
        colorPicker.addEventListener('input', () => {
            textElement.style.color = colorPicker.value;
        });

        // --- SPEED UPDATE ---
        function updateSpeed() {
            const speedVal = parseInt(speedSlider.value);
            const duration = 21 - (speedVal * 0.4); 
            textElement.style.animationDuration = duration + 's';
        }
        speedSlider.addEventListener('input', updateSpeed);
        updateSpeed();

        // --- NEW: SIZE UPDATE ---
        function updateSize() {
            // value is in 'vw' (viewport width) so it scales with screen
            textElement.style.fontSize = sizeSlider.value + "vw";
        }
        sizeSlider.addEventListener('input', updateSize);

        // --- LED TOGGLE ---
        ledBtn.addEventListener('click', () => {
            isLedMode = !isLedMode;
            if (isLedMode) {
                document.body.classList.add('led-mode');
                textElement.style.fontFamily = "'Courier New', monospace"; 
                ledBtn.innerText = "LED FX: ON";
                ledBtn.style.background = "#00ff00";
                ledBtn.style.color = "black";
            } else {
                document.body.classList.remove('led-mode');
                textElement.style.fontFamily = "sans-serif";
                ledBtn.innerText = "LED FX: OFF";
                ledBtn.style.background = "#0084ff";
                ledBtn.style.color = "white";
            }
        });

        // --- COPY LINK ---
        document.getElementById('copyLinkBtn').addEventListener('click', () => {
            const baseUrl = window.location.href.split('?')[0];
            const msg = encodeURIComponent(input.value);
            const col = colorPicker.value.replace('#', '');
            const spd = speedSlider.value;
            // Note: We aren't saving 'size' in the URL to keep it simple, 
            // but you can add it if you want!
            
            const fullLink = `${baseUrl}?msg=${msg}&color=${col}&speed=${spd}`;
            navigator.clipboard.writeText(fullLink).then(() => {
                alert("Link copied!");
            });
        });

        // --- TAP TO HIDE ---
        document.body.addEventListener('click', (e) => {
            const clickedInsideControls = controls.contains(e.target);
            if (!clickedInsideControls) {
                controls.classList.toggle('hidden');
            }
        });

    </script>
</body>
</html>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js');
            });
        }
    </script>
</body>
</html>
