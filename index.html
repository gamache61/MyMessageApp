<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Message Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.svg">

    <style>
        body {
            background-color: #000000;
            color: #f3f4f6;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden; /* Stop scrollbars */
            height: 100vh;
            width: 100vw;
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        /* --- THE STAGE (Where text lives) --- */
        #stage {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            overflow: hidden; /* For scrolling text */
            position: relative;
        }

        /* The wrapper that holds the letters */
        #message-content {
            display: flex;
            flex-wrap: wrap; /* Wrap normally */
            justify-content: center;
            gap: 0.2rem;
            width: 100%;
            transition: all 0.5s;
        }

        /* SCROLL MODE (Ticker) */
        #message-content.scroll-mode {
            flex-wrap: nowrap; /* Don't wrap lines */
            position: absolute;
            white-space: nowrap;
            animation: scroll-left 10s linear infinite;
            justify-content: flex-start;
            width: auto; /* Let it stretch */
        }

        @keyframes scroll-left {
            from { transform: translateX(100vw); }
            to { transform: translateX(-100%); }
        }

        /* --- THE LETTERS --- */
        .char {
            font-size: 5rem; /* MASSIVE TEXT */
            font-weight: 900;
            color: #22c55e; /* Hacker Green */
            text-shadow: 0 0 20px #22c55e;
            opacity: 0; /* Invisible by default */
            transform: translateY(20px);
            transition: opacity 0.2s, transform 0.2s;
            display: inline-block;
        }

        /* Space character needs width */
        .char.space { width: 2rem; }

        /* Visible State */
        .char.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* BLINK ANIMATION */
        .blinking .char {
            animation: blinker 0.3s infinite alternate;
        }
        @keyframes blinker {
            from { opacity: 1; }
            to { opacity: 0.2; }
        }

        /* --- UI CONTROLS (Top Bar) --- */
        #ui-panel {
            background: #111827;
            border-bottom: 2px solid #374151;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 50;
            transition: opacity 0.5s;
        }

        input {
            background: #000;
            border: 2px solid #374151;
            padding: 15px;
            font-size: 1.5rem;
            color: white;
            width: 80%;
            max-width: 800px;
            text-align: center;
            border-radius: 8px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 15px 25px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }

        /* HIDE UI CLASS */
        .hidden-ui {
            display: none !important;
        }

        /* Exit Hint */
        #exit-hint {
            position: absolute;
            top: 10px; right: 10px;
            color: #555;
            font-size: 0.8rem;
            opacity: 0;
            transition: opacity 2s;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui-panel">
        <div class="w-full text-center">
            <label class="text-gray-400 text-sm tracking-widest uppercase block mb-2">Enter Your Text Here</label>
            <input type="text" id="input-msg" value="I LOVE YOU">
        </div>

        <div class="btn-group">
            <button onclick="loadAndReveal()" class="bg-blue-600 text-white hover:bg-blue-500">
                ▶ REVEAL (1 by 1)
            </button>
            
            <button onclick="toggleBlink()" class="bg-red-600 text-white hover:bg-red-500">
                ⚠ BLINK
            </button>

            <button onclick="toggleScroll()" class="bg-purple-600 text-white hover:bg-purple-500">
                ↔ SCROLL
            </button>

            <button onclick="enterPresentMode()" class="bg-green-600 text-white hover:bg-green-500 border-2 border-white">
                📺 HIDE UI (FULLSCREEN)
            </button>
            
            <button onclick="copyLink()" class="bg-gray-700 text-gray-300 hover:bg-gray-600 text-sm">
                🔗 COPY LINK TO SEND
            </button>
        </div>
    </div>

    <div id="stage" onclick="exitPresentMode()">
        <div id="exit-hint">Tap screen to show controls</div>
        <div id="message-content">
            </div>
    </div>

    <script>
        const container = document.getElementById('message-content');
        const input = document.getElementById('input-msg');
        let isBlinking = false;
        let isScrolling = false;

        // 1. CHECK URL FOR MESSAGE (For when you send it to someone)
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const sharedMsg = urlParams.get('msg');
            
            if (sharedMsg) {
                // If opening a shared link, hide UI immediately and play
                document.getElementById('ui-panel').classList.add('hidden-ui');
                input.value = decodeURIComponent(sharedMsg);
                loadAndReveal();
            } else {
                // Default load
                loadAndReveal();
            }
            
            // Connect Service Worker
            if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
        };

        // 2. REVEAL LOGIC (One by One)
        function loadAndReveal() {
            const text = input.value.toUpperCase();
            container.innerHTML = ''; // Clear old
            
            // Split into characters
            const chars = text.split('');
            
            chars.forEach((char, index) => {
                const span = document.createElement('span');
                span.classList.add('char');
                
                if (char === ' ') {
                    span.classList.add('space');
                    span.innerHTML = '&nbsp;';
                } else {
                    span.innerText = char;
                }
                
                container.appendChild(span);

                // The Magic: Delay adding the 'visible' class
                setTimeout(() => {
                    span.classList.add('visible');
                }, index * 150); // 150ms delay between each letter
            });
        }

        // 3. SCROLL LOGIC
        function toggleScroll() {
            isScrolling = !isScrolling;
            if (isScrolling) {
                container.classList.add('scroll-mode');
            } else {
                container.classList.remove('scroll-mode');
            }
        }

        // 4. BLINK LOGIC
        function toggleBlink() {
            isBlinking = !isBlinking;
            if (isBlinking) {
                document.body.classList.add('blinking');
            } else {
                document.body.classList.remove('blinking');
            }
        }

        // 5. PRESENT MODE (Hide UI)
        function enterPresentMode() {
            document.getElementById('ui-panel').classList.add('hidden-ui');
            // Show a hint that fades away
            const hint = document.getElementById('exit-hint');
            hint.style.opacity = 1;
            setTimeout(() => hint.style.opacity = 0, 3000);
        }

        function exitPresentMode() {
            // Only if UI is currently hidden
            const ui = document.getElementById('ui-panel');
            if (ui.classList.contains('hidden-ui')) {
                ui.classList.remove('hidden-ui');
            }
        }

        // 6. SHARE LINK GENERATOR
        function copyLink() {
            const msg = encodeURIComponent(input.value);
            // Create link: currentURL + ?msg=YOUR TEXT
            const link = `${window.location.origin}${window.location.pathname}?msg=${msg}`;
            
            navigator.clipboard.writeText(link).then(() => {
                alert("Link Copied! Send this to someone and they will see ONLY the message.");
            });
        }
    </script>

</body>
</html>
