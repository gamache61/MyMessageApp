<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My App</title>
    
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">

    <style>
        /* This makes the app dark and prevents bouncing on mobile */
        body {
            margin: 0;
            background-color: #000000;
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden; /* Stops scrolling if you don't need it */
        }
    </style>
</head>
<body>

    <div style="text-align: center; padding-top: 50px;">
        <h1>My Custom App</h1>
        <p></p><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Message</title>
    <style>
        body {
            height: 100dvh; 
            -webkit-text-size-adjust: 100%;
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
            display: flex;
            align-items: center; 
        }

        /* --- THE SURPRISE CURTAIN (THE REVEAL) --- */
        #reveal-curtain {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #111;
            z-index: 2000; /* On top of everything */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            transition: opacity 0.8s ease;
        }
        
        #reveal-curtain.open {
            opacity: 0;
            pointer-events: none;
        }

        .envelope-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-20px);}
            60% {transform: translateY(-10px);}
        }

        /* --- SCROLLING TEXT --- */
        #marquee-container {
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            position: absolute;
        }

        #scrolling-text {
            display: inline-block;
            font-size: 20vw; 
            font-weight: bold;
            color: #00ff00; 
            padding-left: 100%; 
            /* Animation duration is set by JS */
            animation-name: scroll-left;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        /* BLINK ANIMATION CLASS */
        .blinking {
            animation: scroll-left linear infinite, blink-anim 0.5s step-end infinite alternate;
        }

        @keyframes scroll-left {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        @keyframes blink-anim {
            50% { opacity: 0; }
        }

        /* LED MODE STYLES */
        .led-mode {
            background-image: radial-gradient(#000 20%, transparent 20%), radial-gradient(#000 20%, transparent 20%);
            background-color: #222;
            background-position: 0 0, 4px 4px;
            background-size: 8px 8px;
            text-shadow: 0 0 10px currentColor; 
        }

        /* CONTROL PANEL */
        #controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(40, 40, 40, 0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 1000;
            width: 85%;
            max-width: 400px;
            border: 1px solid #555;
            transition: opacity 0.3s ease;
        }

        #controls.hidden {
            opacity: 0;
            pointer-events: none; 
        }

        input, select, button {
            padding: 10px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
        }
        input[type="text"] { background: #eee; font-weight: bold; }
        button { background: #0084ff; color: white; cursor: pointer; font-weight: bold; }
        label { color: white; font-size: 14px; }
        .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
    </style>
</head>
<body>

    <div id="reveal-curtain" style="display: none;">
        <div class="envelope-icon">📩</div>
        <h2>You have a message!</h2>
        <p>(Tap to open)</p>
    </div>

    <div id="marquee-container">
        <div id="scrolling-text">TYPE MESSAGE</div>
    </div>

    <div id="controls">
        <input type="text" id="messageInput" placeholder="Type message..." value="HELLO">
        
        <div class="row">
            <input type="color" id="colorPicker" value="#00ff00" style="height: 40px; width: 60px;">
            <button id="ledToggle" style="flex-grow:1; font-size:14px;">LED: OFF</button>
            <button id="blinkToggle" style="flex-grow:1; font-size:14px;">BLINK: OFF</button>
        </div>

        <div class="row">
            <label>Speed:</label>
            <input type="range" id="speedSlider" min="1" max="50" value="10" style="flex-grow:1;">
        </div>

        <div class="row">
            <label>Size:</label>
            <input type="range" id="sizeSlider" min="5" max="50" value="20" style="flex-grow:1;">
        </div>

        <button id="copyLinkBtn">Copy Link to Send</button>
        <div style="text-align: center; color: #888; font-size: 12px;">(Tap screen to edit)</div>
    </div>

    <script>
        const textElement = document.getElementById('scrolling-text');
        const input = document.getElementById('messageInput');
        const colorPicker = document.getElementById('colorPicker');
        const speedSlider = document.getElementById('speedSlider');
        const sizeSlider = document.getElementById('sizeSlider');
        const ledBtn = document.getElementById('ledToggle');
        const blinkBtn = document.getElementById('blinkToggle');
        const controls = document.getElementById('controls');
        const curtain = document.getElementById('reveal-curtain');
        
        let isLedMode = false;
        let isBlinkMode = false;

        // --- 1. INITIALIZE APP ---
        const params = new URLSearchParams(window.location.search);
        
        if (params.has('msg')) {
            // RECEIVER MODE
            
            // 1. Show the Curtain immediately
            curtain.style.display = 'flex';
            
            // 2. Hide controls immediately
            controls.className = 'hidden';

            // 3. Load Settings
            input.value = decodeURIComponent(params.get('msg'));
            textElement.innerText = input.value;
            
            if (params.has('color')) textElement.style.color = '#' + params.get('color');
            if (params.has('speed')) speedSlider.value = params.get('speed');
            if (params.has('size')) sizeSlider.value = params.get('size');
            
            // 4. Load Toggles
            if (params.get('led') === 'true') toggleLED(true);
            if (params.get('blink') === 'true') toggleBlink(true);
            
            // 5. Update Visuals
            updateSpeed();
            updateSize();

        } else {
            // CREATOR MODE (Default)
            updateSpeed();
            updateSize();
        }

        // --- 2. THE REVEAL CLICK ---
        curtain.addEventListener('click', () => {
            curtain.classList.add('open'); // Fades out
            setTimeout(() => { curtain.style.display = 'none'; }, 800);
        });

        // --- 3. CORE FUNCTIONS ---
        input.addEventListener('input', () => { textElement.innerText = input.value || " "; });
        colorPicker.addEventListener('input', () => { textElement.style.color = colorPicker.value; });
        
        function updateSpeed() {
            const speedVal = parseInt(speedSlider.value);
            const duration = 21 - (speedVal * 0.4); 
            textElement.style.animationDuration = duration + 's';
        }
        speedSlider.addEventListener('input', updateSpeed);

        function updateSize() {
            textElement.style.fontSize = sizeSlider.value + "vw";
        }
        sizeSlider.addEventListener('input', updateSize);

        // --- TOGGLES ---
        function toggleLED(forceState = null) {
            // If forceState is provided (true/false), use it. Otherwise flip current state.
            isLedMode = (forceState !== null) ? forceState : !isLedMode;
            
            if (isLedMode) {
                document.body.classList.add('led-mode');
                textElement.style.fontFamily = "'Courier New', monospace"; 
                ledBtn.innerText = "LED: ON";
                ledBtn.style.background = "#00ff00";
                ledBtn.style.color = "black";
            } else {
                document.body.classList.remove('led-mode');
                textElement.style.fontFamily = "sans-serif";
                ledBtn.innerText = "LED: OFF";
                ledBtn.style.background = "#0084ff";
                ledBtn.style.color = "white";
            }
        }
        ledBtn.addEventListener('click', () => toggleLED());

        function toggleBlink(forceState = null) {
            isBlinkMode = (forceState !== null) ? forceState : !isBlinkMode;
            
            if (isBlinkMode) {
                textElement.classList.add('blinking');
                blinkBtn.innerText = "BLINK: ON";
                blinkBtn.style.background = "#ff0000";
            } else {
                textElement.classList.remove('blinking');
                blinkBtn.innerText = "BLINK: OFF";
                blinkBtn.style.background = "#0084ff";
            }
        }
        blinkBtn.addEventListener('click', () => toggleBlink());


        // --- 4. COPY LINK ---
        document.getElementById('copyLinkBtn').addEventListener('click', () => {
            const baseUrl = window.location.href.split('?')[0];
            const msg = encodeURIComponent(input.value);
            const col = colorPicker.value.replace('#', '');
            const spd = speedSlider.value;
            const siz = sizeSlider.value;
            
            const fullLink = `${baseUrl}?msg=${msg}&color=${col}&speed=${spd}&size=${siz}&led=${isLedMode}&blink=${isBlinkMode}`;
            
            navigator.clipboard.writeText(fullLink).then(() => {
                alert("Link Copied! \n\nWhen they open it, they will see the 'You have a message' curtain first.");
            });
        });

        // --- 5. HIDE/SHOW CONTROLS ---
        document.body.addEventListener('click', (e) => {
            // Ignore clicks on curtain or inside controls
            if (controls.contains(e.target) || curtain.contains(e.target)) return;
            
            // Toggle visibility
            if (controls.classList.contains('hidden')) {
                controls.classList.remove('hidden');
            } else {
                controls.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js');
            });
        }
    </script>
</body>
</html>
