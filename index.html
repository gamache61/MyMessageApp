<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Message Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="manifest" href="manifest.json">

    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        body {
            background-color: #000000;
            color: #f3f4f6;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        /* --- STAGE --- */
        #stage {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            overflow: hidden;
            position: relative;
            perspective: 1000px;
            padding: 20px;
        }

        #message-content {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: center;
            gap: 1rem;
            width: 100%;
            max-height: 100%;
            pointer-events: none;
        }

        .word-block {
            display: inline-flex;
            white-space: nowrap;
        }

        .char {
            font-size: 3.5rem;
            font-weight: 900;
            color: #22c55e;
            text-shadow: 0 0 15px #22c55e;
            display: inline-block;
            transform: translate3d(0,0,0) rotate(0deg) scale(1);
            opacity: 1;
        }

        /* --- EFFECT 1: SCROLL --- */
        #message-content.scroll-mode {
            flex-wrap: nowrap;
            position: absolute;
            white-space: nowrap;
            animation: scroll-left 10s linear infinite;
            justify-content: flex-start;
            width: auto;
            gap: 2rem;
        }
        @keyframes scroll-left {
            from { transform: translateX(100vw); }
            to { transform: translateX(-100%); }
        }

        /* --- EFFECT 2: BLINK --- */
        .blinking .char {
            animation: blinker 0.2s infinite alternate;
        }
        @keyframes blinker {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        /* --- EFFECT 3: FLY IN --- */
        .flying .char {
            animation: fly-cycle 4s ease-in-out infinite;
        }

        @keyframes fly-cycle {
            0% { opacity: 0; transform: translate3d(var(--rx), var(--ry), var(--rz)) rotate(var(--rr)) scale(0); }
            30% { opacity: 1; transform: translate3d(0,0,0) rotate(0deg) scale(1); }
            80% { opacity: 1; transform: translate3d(0,0,0) rotate(0deg) scale(1); }
            100% { opacity: 0; transform: translate3d(var(--rx), var(--ry), -500px) rotate(var(--rr)); }
        }

        /* --- UI PANEL --- */
        #ui-panel {
            background: #111827;
            border-bottom: 2px solid #374151;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 50;
            transition: opacity 0.5s;
        }

        input {
            background: #000;
            border: 2px solid #374151;
            padding: 15px;
            font-size: 1.5rem;
            color: white;
            width: 80%;
            max-width: 800px;
            text-align: center;
            border-radius: 8px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 15px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            transition: transform 0.1s;
            border: 2px solid transparent;
        }
        button:active { transform: scale(0.95); }
        
        button.active-btn {
            border-color: white;
            box-shadow: 0 0 15px rgba(255,255,255,0.3);
        }

        .permanently-hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="ui-panel">
        <div class="w-full text-center">
            <label class="text-gray-400 text-sm tracking-widest uppercase block mb-2">Secret Message Terminal</label>
            <input type="text" id="input-msg" value="I LOVE YOU">
        </div>

        <div class="btn-group">
            <button onclick="activateFly()" id="btn-fly" class="bg-blue-600 text-white">🦋 Fly In</button>
            <button onclick="activateBlink()" id="btn-blink" class="bg-red-600 text-white">⚠ Blink</button>
            <button onclick="activateScroll()" id="btn-scroll" class="bg-purple-600 text-white">↔ Scroll</button>
            <button onclick="copyLink()" class="bg-gray-700 text-gray-300 border-gray-500">🔗 Copy Link</button>
        </div>
        <p class="text-xs text-gray-500 mt-2">Send link to lock screen for receiver.</p>
    </div>

    <div id="stage">
        <div id="message-content"></div>
    </div>

    <script>
        const container = document.getElementById('message-content');
        const input = document.getElementById('input-msg');
        let currentMode = null; 

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const sharedMsg = urlParams.get('msg');
            
            if (sharedMsg) {
                const ui = document.getElementById('ui-panel');
                ui.classList.add('permanently-hidden'); 
                ui.innerHTML = ""; 
                input.value = decodeURIComponent(sharedMsg);
                activateFly(); 
            } else {
                renderText(); 
            }
            
            // SERVICE WORKER REGISTRATION
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js')
                .then(() => console.log('Service Worker Registered'))
                .catch(err => console.log('SW Failed:', err));
            }
        };

        function renderText() {
            const text = input.value.toUpperCase();
            container.innerHTML = ''; 
            const words = text.split(' ');

            words.forEach(wordStr => {
                const wordDiv = document.createElement('div');
                wordDiv.classList.add('word-block');
                const chars = wordStr.split('');
                
                chars.forEach(char => {
                    const span = document.createElement('span');
                    span.classList.add('char');
                    const rX = (Math.random() * 2000 - 1000) + 'px';
                    const rY = (Math.random() * 2000 - 1000) + 'px';
                    const rZ = (Math.random() * 1000 - 500) + 'px';
                    const rR = (Math.random() * 720 - 360) + 'deg';

                    span.style.setProperty('--rx', rX);
                    span.style.setProperty('--ry', rY);
                    span.style.setProperty('--rz', rZ);
                    span.style.setProperty('--rr', rR);
                    span.innerText = char;
                    wordDiv.appendChild(span);
                });
                container.appendChild(wordDiv);
            });
        }

        function resetEffects() {
            renderText(); 
            container.className = ''; 
            document.body.classList.remove('blinking'); 
            document.querySelectorAll('button').forEach(b => b.classList.remove('active-btn'));
        }

        function activateFly() {
            resetEffects();
            currentMode = 'fly';
            document.getElementById('btn-fly')?.classList.add('active-btn');
            container.classList.add('flying'); 
        }

        function activateBlink() {
            resetEffects();
            currentMode = 'blink';
            document.getElementById('btn-blink')?.classList.add('active-btn');
            document.body.classList.add('blinking');
        }

        function activateScroll() {
            resetEffects();
            currentMode = 'scroll';
            document.getElementById('btn-scroll')?.classList.add('active-btn');
            container.classList.add('scroll-mode');
        }

        function copyLink() {
            const msg = encodeURIComponent(input.value);
            const link = `${window.location.origin}${window.location.pathname}?msg=${msg}`;
            navigator.clipboard.writeText(link).then(() => alert("Link Copied!"));
        }

        input.addEventListener('input', () => {
            if(currentMode) resetEffects(); 
            renderText();
        });
    </script>
</body>
</html>
